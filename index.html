<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sadece Senin İçin...</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; font-family: 'Poppins', sans-serif; background-color: #fffaf0; user-select: none; touch-action: none; }
        
        /* ŞİFRE EKRANI */
        #login-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: #FFB300; z-index: 9999; display: flex; 
            justify-content: center; align-items: center; flex-direction: column;
        }
        .login-box {
            background: white; padding: 40px; border-radius: 30px; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.2); text-align: center;
        }
        .login-box h2 { color: #3e2723; margin-bottom: 20px; font-family: 'Dancing Script', cursive; font-size: 2.5rem; }
        .login-box input {
            padding: 12px; width: 200px; border: 2px solid #FFB300; 
            border-radius: 15px; font-size: 1rem; text-align: center; outline: none;
        }
        .login-box button {
            margin-top: 15px; padding: 10px 25px; background: #3e2723; 
            color: white; border: none; border-radius: 15px; cursor: pointer; font-weight: 600;
        }

        /* DİĞER TÜM CSS (ÖNCEKİLERLE AYNI) */
        .honeycomb-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-image: linear-gradient(30deg, #ffecb3 12%, transparent 12.5%, transparent 87%, #ffecb3 87.5%, #ffecb3), linear-gradient(150deg, #ffecb3 12%, transparent 12.5%, transparent 87%, #ffecb3 87.5%, #ffecb3), linear-gradient(30deg, #ffecb3 12%, transparent 12.5%, transparent 87%, #ffecb3 87.5%, #ffecb3), linear-gradient(150deg, #ffecb3 12%, transparent 12.5%, transparent 87%, #ffecb3 87.5%, #ffecb3), linear-gradient(60deg, #ffeb3b77 25%, transparent 25.5%, transparent 75%, #ffeb3b77 75%, #ffeb3b77), linear-gradient(60deg, #ffeb3b77 25%, transparent 25.5%, transparent 75%, #ffeb3b77 75%, #ffeb3b77); background-size: 80px 140px; z-index: 1; }
        .bee-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1000; pointer-events: none; }
        .flying-bee { position: absolute; font-size: 3.5rem; filter: drop-shadow(3px 5px 8px rgba(0,0,0,0.4)); animation: flyingBees linear infinite; }
        @keyframes flyingBees { 0% { transform: translate(-20vw, 0) rotate(0deg); opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { transform: translate(120vw, -30vh) rotate(25deg); opacity: 0; } }
        .screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; flex-direction: column; z-index: 100; display: none; }
        #screen1 { display: flex; background-color: rgba(255, 250, 240, 0.6); }
        #screen2, #screen3 { background-color: rgba(255, 179, 0, 0.95); }
        .heart-button { background-color: #FFB300; height: 100px; width: 100px; position: relative; transform: rotate(-45deg); border: none; cursor: pointer; animation: heartButtonBeat 1.5s infinite; display: flex; justify-content: center; align-items: center; margin-top: 50px; }
        .heart-button:before, .heart-button:after { content: ""; background-color: #FFB300; border-radius: 50%; height: 100px; width: 100px; position: absolute; }
        .heart-button:before { top: -50px; left: 0; }
        .heart-button:after { top: 0; left: 50px; }
        .heart-text { transform: rotate(45deg); color: #3e2723; font-family: 'Dancing Script', cursive; font-size: 1.5rem; font-weight: 900; position: relative; z-index: 30; text-shadow: 1px 1px 0px rgba(255,255,255,0.8); }
        .beating-heart { color: #d81b60; font-size: 5rem; margin: 0 20px; animation: heartbeat 1s infinite; display: inline-block; }
        @keyframes heartbeat { 0%, 100% { transform: scale(1); } 15% { transform: scale(1.3); } 30% { transform: scale(1); } }
        @keyframes heartButtonBeat { 0%, 100% { transform: rotate(-45deg) scale(1); } 50% { transform: rotate(-45deg) scale(1.1); } }
        .message-content { text-align: center; color: #fff; z-index: 200; }
        .main-message { font-family: 'Dancing Script', cursive; font-size: 4.5rem; margin: 0; text-shadow: 4px 4px 15px rgba(0,0,0,0.3); }
        .signature { font-size: 2.5rem; margin-top: 10px; font-weight: 700; color: #3e2723; }
        .honey-drop { position: fixed; width: 25px; height: 45px; background: #e65100; border-radius: 50% 50% 50% 50% / 70% 70% 30% 30%; box-shadow: inset -4px -6px 12px rgba(0,0,0,0.4); z-index: 50; pointer-events: none; animation: drip 2.5s ease-in forwards; }
        @keyframes drip { 0% { transform: scale(0.4) translateY(0); opacity: 1; } 100% { transform: scale(1.1) translateY(110vh); opacity: 0; } }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-box">
            <h2>Bizim Şifremiz? 🍯</h2>
            <input type="password" id="pass" placeholder="Şifreyi yaz...">
            <br>
            <button onclick="checkPass()">Giriş Yap</button>
        </div>
    </div>

    <div class="honeycomb-bg"></div>

    <div class="bee-container">
        <div class="flying-bee" style="left: -10%; top: 15%; animation-duration: 7s;">🐝</div>
        <div class="flying-bee" style="left: 120%; top: 20%; animation-duration: 8s; animation-direction: reverse;">🐝</div>
    </div>

    <div id="screen1" class="screen">
        <button class="heart-button" onclick="changeScreen('screen1', 'screen2')">
            <span class="heart-text">Balım</span>
        </button>
        <p style="color: #3e2723; font-weight: 900; margin-top: 130px;">Tıkla Balım...</p>
    </div>

    <div id="screen2" class="screen" onmousedown="startDrip(event)" onmouseup="stopDrip()" onmousemove="updateCoords(event)">
        <div class="message-content">
            <h1 class="main-message">Seni çok seviyorum balım</h1>
            <div class="signature">Onur</div>
            <button class="heart-button" onclick="changeScreen('screen2', 'screen3')" style="margin: 30px auto 0 auto;">
                <span class="heart-text">Tıkla</span>
            </button>
        </div>
    </div>

    <div id="screen3" class="screen" onmousedown="startDrip(event)" onmouseup="stopDrip()" onmousemove="updateCoords(event)">
        <div class="message-content">
            <h1 class="main-message">Onur <span class="beating-heart">❤️</span> Secem</h1>
            <div class="signature">Sen benim kraliçe arımsın</div>
        </div>
    </div>

    <script>
        // Şifre kontrolü
        function checkPass() {
            const input = document.getElementById('pass').value.toLowerCase();
            if (input === "balımmm") { // ŞİFRE BURADA
                document.getElementById('login-screen').style.display = 'none';
            } else {
                alert("Yanlış şifre balım, tekrar dene!");
            }
        }

        let dripInterval, currentX = 0, currentY = 0;
        function updateCoords(e) { currentX = e.clientX || (e.touches && e.touches[0].clientX); currentY = e.clientY || (e.touches && e.touches[0].clientY); }
        function createSingleDrip() { if (currentX === 0 && currentY === 0) return; const drop = document.createElement('div'); drop.className = 'honey-drop'; drop.style.left = (currentX + (Math.random()*40-20)) + 'px'; drop.style.top = currentY + 'px'; document.body.appendChild(drop); setTimeout(() => { drop.remove(); }, 2500); }
        function startDrip(e) { updateCoords(e); dripInterval = setInterval(createSingleDrip, 80); }
        function stopDrip() { clearInterval(dripInterval); }
        function changeScreen(hideId, showId) { document.getElementById(hideId).style.display = 'none'; const next = document.getElementById(showId); next.style.display = 'flex'; }
    </script>
</body>
</html>
